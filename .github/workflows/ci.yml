---
name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          files="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          if [ -n "$files" ]; then
            printf 'The following files need gofmt:\n%s\n' "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Verify module graph
        shell: bash
        run: |
          go mod tidy -diff
          modules="$(go list -m all)"
          printf '%s\n' "$modules"
          grep -F 'github.com/tailscale/peercred ' <<<"$modules"
          if grep -Fq 'inet.af/peercred ' <<<"$modules"; then
            echo 'legacy inet.af/peercred remains in the module graph' >&2
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Test and report coverage
        shell: bash
        run: |
          go test -race -count=1 -covermode=atomic \
            -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

      - name: Test with a long macOS temporary path
        if: runner.os == 'macOS'
        shell: bash
        run: |
          long_tmp="/tmp/$(printf 'x%.0s' {1..120})"
          if (( ${#long_tmp} <= 103 )); then
            echo "test TMPDIR must exceed Darwin's UNIX socket path limit" >&2
            exit 1
          fi
          mkdir -p "$long_tmp"
          TMPDIR="$long_tmp" go test -race -count=1 ./cmd/perflock

      - name: Test Bash installer behavior
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n install.bash test/install_test.bash
          bash test/install_test.bash

      - name: Check Bash installer style
        if: runner.os == 'Linux'
        shell: bash
        run: |
          shellcheck install.bash test/install_test.bash
          go run mvdan.cc/sh/v3/cmd/shfmt@v3.12.0 \
            -d -i 2 install.bash test/install_test.bash

      - name: Test launchd job semantics
        if: runner.os == 'macOS'
        run: |
          plutil -lint init/launchd/com.github.aclements.perflock.plist
          python3 test/launchd_test.py

      - name: Test PowerShell installer semantics
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./init/windows/install.Tests.ps1
